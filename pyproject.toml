[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iptv-clean"
version = "0.1.0"
description = "以真实 HLS 连续性和画质检测生成 IPTV 订阅"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
iptv-clean = "iptv_clean.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
